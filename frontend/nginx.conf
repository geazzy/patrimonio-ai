server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA servida em /patrimonio
    location /patrimonio/ {
        try_files $uri $uri/ /patrimonio/index.html;
    }

    # Redireciona raiz para /patrimonio/
    location = / {
        return 301 /patrimonio/;
    }

    # Cache leve para assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ /patrimonio/index.html;
    }
}
